name: Classify and run Yarn commands (install, lint, prettier and test)

on:
  push:
    branches:
      - main
      - dev
      - hotfix**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches-ignore:
      - main

# Cancel a superseded run so a stale (e.g. skipped-on-merge-sync) result never
# remains the authoritative status for the PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-pr-check:
        uses: repowerednl/.github/.github/workflows/check-draft.yml@main
        with:
          is-draft: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}

  # Early classification: detects a GitHub "Update branch" merge sync so the yarn
  # checks can be skipped for it.
  classify:
    uses: repowerednl/.github/.github/workflows/classify-pr-event.yml@main

  yarn-check-lint-prettier-test:
    needs: [draft-pr-check, classify]
    # Skip the yarn checks on a merge sync (the code was already validated before the sync).
    if: needs.classify.outputs.is-merge-sync != 'true'
    permissions:
      contents: read
      packages: read
    uses: repowerednl/.github/.github/workflows/yarn-check-lint-prettier-test.yml@main
    # with:
    #   prettier_check_content: # Optional, defaults to "{json-server,src}/**/*.{js,vue,json,html,css,md}"
    #   node_version: # Optional, defaults to "24"
    #   container_image: # Optional, e.g. mcr.microsoft.com/playwright:v1.63.0-noble
    #   container_options: # Optional, e.g. --ipc=host
    #   setup_commands: | # Optional, e.g.
    #     yarn playwright install --with-deps chromium
    secrets:
      packages_auth_token: ${{ secrets.GITHUB_TOKEN }}
