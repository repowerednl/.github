name: Classify PR Event
# Early classification used to skip the (expensive) test suite + sonar jobs when a PR
# 'synchronize' event is either a GitHub "Update branch" merge sync (base merged into
# head, no developer changes) or a commit from our own automation bot (e.g. an
# image-tag bump). The classifier is intentionally biased towards 'false' (i.e. run
# the test suite) whenever anything is uncertain.

on:
  workflow_call:
    outputs:
      is-merge-sync:
        description: "true when this synchronize is a GitHub 'Update branch' merge sync"
        value: ${{ jobs.classify.outputs.is-merge-sync }}
      is-bot-commit:
        description: "true when the triggering actor is one of vars.BOT_NAMES and the previous commit was provably green"
        value: ${{ jobs.classify.outputs.is-bot-commit }}

jobs:
  classify:
    name: Classify PR event
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      is-merge-sync: ${{ steps.detect.outputs.is_merge_sync }}
      is-bot-commit: ${{ steps.detect.outputs.is_bot_commit }}
    steps:
      - name: Classify synchronize event
        id: detect
        uses: actions/github-script@v9
        env:
          # Comma-separated bot logins, e.g. "repowered-token-generator[bot],dependabot[bot]".
          # Set as an organization or repo variable, whichever scope fits.
          BOT_NAMES: ${{ vars.BOT_NAMES }}
        with:
          script: |
            // ok=true only if every check run on `sha` completed successfully. Shared by
            // both classifications below, so skipping never masks a real failure sitting
            // underneath an automated commit.
            const wasProvablyGreen = async (sha) => {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });
              const runs = checks.check_runs;
              if (!runs.length) {
                return { ok: false, reason: `${sha.slice(0, 7)} has no check runs to confirm it was green` };
              }
              const failing = runs.filter(r =>
                ['failure', 'timed_out', 'cancelled', 'action_required', 'stale']
                  .includes(r.conclusion));
              if (failing.length) {
                return { ok: false, reason: `${sha.slice(0, 7)} had failing checks `
                  + `(${failing.map(r => r.name).join(', ')})` };
              }
              const pending = runs.filter(r => r.status !== 'completed');
              if (pending.length) {
                return { ok: false, reason: `${sha.slice(0, 7)} still has unfinished checks `
                  + `(${pending.map(r => r.name).join(', ')})` };
              }
              return { ok: true, reason: `${sha.slice(0, 7)} was green` };
            };

            // Returns { value, reason }; biased to 'false' (run tests) when unsure.
            let head;
            const decideMergeSync = async () => {
              // Only PR 'synchronize' events can be a merge sync. Everything else
              // (push, opened, reopened, ready_for_review) runs the full suite.
              if (context.eventName !== 'pull_request'
                  || context.payload.action !== 'synchronize') {
                return { value: 'false', reason: `Not a PR synchronize event `
                  + `(event=${context.eventName}, action=${context.payload.action ?? '-'}).` };
              }

              const pr = context.payload.pull_request;
              // Never use payload.before: it is all-zeros on first push / force-push.
              const headSha = context.payload.after || pr.head.sha;

              const { data } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });
              head = data;

              // The "Update branch" button always produces a 2-parent merge commit.
              if (!head.parents || head.parents.length !== 2) {
                return { value: 'false', reason: `Head ${headSha.slice(0, 7)} has `
                  + `${head.parents?.length ?? 0} parent(s); not a merge commit.` };
              }

              // ...committed by GitHub web-flow, guaranteeing no developer edits were
              // bundled into this push (a manual `git merge` would not match).
              const committerLogin = head.committer && head.committer.login;
              const committerEmail = head.commit.committer && head.commit.committer.email;
              const isWebFlow = committerLogin === 'web-flow'
                || committerEmail === 'noreply@github.com';
              if (!isWebFlow) {
                return { value: 'false', reason: `Merge commit committed by `
                  + `${committerLogin ?? committerEmail ?? 'unknown'} (not GitHub `
                  + `web-flow); treated as developer work.` };
              }

              // The incoming side of the merge must be contained in the base branch.
              const incoming = head.parents[1].sha;
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: pr.base.ref,
                head: incoming,
              });
              const contained = cmp.status === 'identical' || cmp.status === 'behind';
              if (!contained) {
                return { value: 'false', reason: `Merge commit, but incoming parent `
                  + `${incoming.slice(0, 7)} is not contained in base '${pr.base.ref}' `
                  + `(status=${cmp.status}).` };
              }

              // It IS a genuine "Update branch" merge sync. But only skip the suite if the
              // developer's actual code (parent[0], the previous PR head) was ALREADY green.
              const prevHead = head.parents[0].sha;
              const green = await wasProvablyGreen(prevHead);
              if (!green.ok) {
                return { value: 'false', reason: `Previous ${green.reason}; running the suite.` };
              }
              return {
                value: 'true',
                reason: `GitHub "Update branch" merge of '${pr.base.ref}' into head `
                  + `(incoming parent ${incoming.slice(0, 7)} contained in base; previous `
                  + `${green.reason}).`,
              };
            };

            // Returns { value, reason }; biased to 'false' (run tests) when unsure.
            // Reuses `head` fetched above — it's already available for any PR
            // synchronize event, the only event this check applies to.
            const decideBotCommit = async () => {
              if (context.eventName !== 'pull_request'
                  || context.payload.action !== 'synchronize') {
                return { value: 'false', reason: `Not a PR synchronize event `
                  + `(event=${context.eventName}, action=${context.payload.action ?? '-'}).` };
              }

              const botNames = (process.env.BOT_NAMES || '')
                .split(',').map(s => s.trim()).filter(Boolean);
              if (!botNames.includes(context.actor)) {
                return { value: 'false', reason: `Triggering actor '${context.actor}' `
                  + `not in allowed=[${botNames.join(', ')}].` };
              }

              if (!head || !head.parents || head.parents.length === 0) {
                return { value: 'false', reason: `Actor '${context.actor}' matched, but `
                  + `no parent commit to verify was green; running the suite.` };
              }

              // Only skip if the commit right before this one was ALREADY green —
              // otherwise an automated commit could silently mask a real failure.
              const prevSha = head.parents[0].sha;
              const green = await wasProvablyGreen(prevSha);
              if (!green.ok) {
                return { value: 'false', reason: `Actor '${context.actor}' matched, but `
                  + `previous ${green.reason}; running the suite.` };
              }
              return {
                value: 'true',
                reason: `Triggering actor '${context.actor}' matched; previous ${green.reason}.`,
              };
            };

            const mergeSync = await decideMergeSync();
            core.info(`is_merge_sync=${mergeSync.value} :: ${mergeSync.reason}`);
            core.setOutput('is_merge_sync', mergeSync.value);

            const botCommit = await decideBotCommit();
            core.info(`is_bot_commit=${botCommit.value} :: ${botCommit.reason}`);
            core.setOutput('is_bot_commit', botCommit.value);

            // Surface both decisions on the run page so anyone can see what happened.
            await core.summary
              .addHeading('PR event classification', 3)
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Event', `${context.eventName} / ${context.payload.action ?? '-'}`],
                ['Merge sync?', mergeSync.value === 'true'
                  ? '✅ yes — pytest & sonar are skipped'
                  : '❌ no'],
                ['Merge-sync reason', mergeSync.reason],
                ['Bot commit?', botCommit.value === 'true'
                  ? '✅ yes — pytest is skipped'
                  : '❌ no'],
                ['Bot-commit reason', botCommit.reason],
              ])
              .write();
