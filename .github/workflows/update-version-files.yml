name: Update the version files with a given tag

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: "The Semantic Versioning GitHub tag to write into the version files"
      app-id:
        required: true
        type: string
        description: "Client ID of the GitHub App that commits the version bump"
      # Optional
      version_files:
        required: false
        type: string
        default: "package.json"
        description: "Comma separated files to bump (package.json, pyproject.toml, setup.cfg, Chart.yaml, Dockerfile). All are written in a single commit so they cannot drift apart. Every listed file must hold a version declaration"
    secrets:
      private-key:
        required: true
    outputs:
      version:
        description: "The version that was written, without the leading 'v'"
        value: ${{ jobs.update-version-files.outputs.version }}
      bumped-files:
        description: "Comma separated files that were actually rewritten, empty when everything was already at the target"
        value: ${{ jobs.update-version-files.outputs.bumped-files }}

jobs:
  update-version-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.update.outputs.version }}
      bumped-files: ${{ steps.update.outputs.bumped_files }}
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}

      - name: Checkout ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Update ${{ inputs.version_files }} to ${{ inputs.tag }}
        id: update
        uses: repowerednl/.github/composite-actions/update-version-files@IN-598-extend-bump-other-versioning-files
        with:
          tag: ${{ inputs.tag }}
          version_files: ${{ inputs.version_files }}

      - name: Commit and push ${{ steps.update.outputs.bumped_files }}
        if: steps.update.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.update.outputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Automated version bump to $VERSION [skip ci]"
          git push origin HEAD
